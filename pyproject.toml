[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer", "rich", "pydantic", "PyYAML",
    "httpx", "aiolimiter", "tenacity", "dnspython",
    "SQLAlchemy", "aiosqlite", "playwright",
    "jsbeautifier", "tree-sitter", "networkx",
    "jinja2", "fastapi", "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
reconforge = "reconforge.cli:app"

[tool.setuptools.packages.find]
include = ["reconforge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
